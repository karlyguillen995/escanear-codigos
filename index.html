<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Escanear códigos</title>
<style>
  :root { --bg:#f4f6f8; --fg:#1b1f23; --card:#fff; --accent:#1565c0; --ok:#2e7d32; --err:#c62828; --line:#cfd6dd; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size:18px;
    -webkit-text-size-adjust:100%; touch-action: manipulation; }
  body { padding:12px; max-width:560px; margin:0 auto; }
  h1 { font-size:24px; margin:4px 0 12px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  label { display:block; font-weight:600; margin:10px 0 6px; }
  input, textarea, select { width:100%; font-size:20px; padding:14px; border:2px solid var(--line); border-radius:12px; background:#fff; color:var(--fg); }
  textarea { min-height:90px; resize:vertical; }
  .tipo { display:flex; gap:10px; }
  .tipo button { flex:1; font-size:22px; padding:18px 8px; border:2px solid var(--accent); border-radius:12px; background:#fff; color:var(--accent); font-weight:700; }
  .tipo button.sel { background:var(--accent); color:#fff; }
  .btn { width:100%; font-size:22px; font-weight:700; padding:18px; border:none; border-radius:14px; color:#fff; background:var(--accent); margin-top:10px; }
  .btn.sec { background:#455a64; }
  .btn.ok { background:var(--ok); }
  .btn:disabled { opacity:.5; }
  #video { width:100%; border-radius:12px; background:#000; display:none; aspect-ratio:3/4; object-fit:cover; }
  #status { min-height:24px; font-size:17px; margin:8px 0 0; }
  .msg-ok { color:var(--ok); font-weight:700; }
  .msg-err { color:var(--err); font-weight:700; }
  .hint { font-size:15px; color:#56606a; margin:6px 0 0; }
</style>
</head>
<body>

<h1>Escanear códigos</h1>

<div class="card">
  <label>Tipo</label>
  <div class="tipo">
    <button type="button" id="tipoBodega" class="sel">Bodega</button>
    <button type="button" id="tipoMedidor">Medidor</button>
  </div>
</div>

<div class="card">
  <button type="button" class="btn" id="btnScan">Escanear con cámara</button>
  <video id="video" playsinline muted autoplay></video>
  <button type="button" class="btn sec" id="btnStop" style="display:none">Detener cámara</button>
  <p class="hint">Formatos: EAN-13 y Code 128.</p>
</div>

<div class="card">
  <label for="codigo">Código</label>
  <input id="codigo" type="text" inputmode="text" autocomplete="off" autocapitalize="characters">

  <label for="cantidad" id="lblCantidad">Cantidad</label>
  <input id="cantidad" type="text" inputmode="decimal" autocomplete="off">

  <label for="usuario">Usuario</label>
  <input id="usuario" type="text" autocomplete="off">

  <label for="notas">Notas</label>
  <textarea id="notas"></textarea>

  <button type="button" class="btn ok" id="btnGuardar">Guardar</button>
  <p id="status" role="status"></p>
</div>

<!-- ZXing (respaldo para iPhone / navegadores sin BarcodeDetector) -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function () {
  // ======== CONFIGURACIÓN ========
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbzvuUAzSvSzyO7gnN0h2g3crh0iJ4-mZjUD4ntMJq-5m2uQY4AtB_ee6PDbBzDD9WHPuQ/exec";   // URL /exec de Apps Script
  var TOKEN = "MI-TOKEN";
  var HOJA = "Escaneos";
  // ===============================

  var $ = function (id) { return document.getElementById(id); };
  var tipo = "Bodega";
  var stream = null, detector = null, zxingReader = null, scanning = false, rafId = null;
  var FORMATS = ["ean_13", "code_128"];

  function setStatus(text, cls) { var s = $("status"); s.textContent = text; s.className = cls || ""; }

  // ---- Selector Tipo ----
  function setTipo(t) {
    tipo = t;
    $("tipoBodega").classList.toggle("sel", t === "Bodega");
    $("tipoMedidor").classList.toggle("sel", t === "Medidor");
    $("lblCantidad").textContent = t === "Medidor" ? "Lectura" : "Cantidad";
    $("cantidad").setAttribute("inputmode", t === "Medidor" ? "decimal" : "numeric");
  }
  $("tipoBodega").onclick = function () { setTipo("Bodega"); };
  $("tipoMedidor").onclick = function () { setTipo("Medidor"); };

  // ---- Cámara ----
  function onDetected(code, format) {
    $("codigo").value = code;
    setStatus("Leído: " + code + " (" + format + ")", "msg-ok");
    stopCamera();
    if (navigator.vibrate) navigator.vibrate(120);
  }

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("Este navegador no permite usar la cámara. Usa HTTPS y Safari o Chrome actualizados.", "msg-err");
      return false;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
    } catch (e) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      } catch (e2) {
        setStatus("No se pudo abrir la cámara. Permite el acceso a la cámara en el navegador (Ajustes > Safari > Cámara).", "msg-err");
        return false;
      }
    }
    var v = $("video");
    v.setAttribute("playsinline", "");
    v.setAttribute("muted", "");
    v.muted = true;
    v.srcObject = stream;
    v.style.display = "block";
    $("btnStop").style.display = "block";
    try {
      await v.play();
    } catch (e) {
      setStatus("La cámara no pudo iniciar el video. Toca Escanear de nuevo.", "msg-err");
      stopCamera();
      return false;
    }
    return true;
  }

  function stopCamera() {
    scanning = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (zxingReader) { try { zxingReader.reset(); } catch (e) {} zxingReader = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    $("video").style.display = "none";
    $("video").srcObject = null;
    $("btnStop").style.display = "none";
  }

  async function scanLoopBarcodeDetector() {
    var v = $("video");
    scanning = true;
    async function tick() {
      if (!scanning) return;
      try {
        var codes = await detector.detect(v);
        if (codes && codes.length) { onDetected(codes[0].rawValue, codes[0].format); return; }
      } catch (e) {}
      rafId = requestAnimationFrame(tick);
    }
    tick();
  }

  // Lectura cuadro por cuadro con ZXing (iPhone y navegadores sin BarcodeDetector)
  function scanWithZXing() {
    if (!window.ZXing) { setStatus("No se cargó el lector de respaldo. Revisa tu conexión y recarga la página.", "msg-err"); return; }
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.CODE_128]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    var reader = new ZXing.MultiFormatReader();
    reader.setHints(hints);
    var v = $("video");
    var canvas = document.createElement("canvas");
    var g = canvas.getContext("2d", { willReadFrequently: true });
    var lastT = 0;
    scanning = true;

    function frame(t) {
      if (!scanning) return;
      rafId = requestAnimationFrame(frame);
      if (t - lastT < 120) return;              // ~8 lecturas por segundo
      lastT = t;
      if (!v.videoWidth || v.readyState < 2) return;
      // Recorte central para leer mejor (el código suele ir en el centro)
      var vw = v.videoWidth, vh = v.videoHeight;
      var cw = Math.round(vw * 0.9), ch = Math.round(vh * 0.6);
      canvas.width = cw; canvas.height = ch;
      g.drawImage(v, Math.round((vw - cw) / 2), Math.round((vh - ch) / 2), cw, ch, 0, 0, cw, ch);
      try {
        var source = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
        var bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(source));
        var result = reader.decode(bitmap);
        reader.reset();
        onDetected(result.getText(), String(result.getBarcodeFormat()).replace("BarcodeFormat.", ""));
      } catch (e) {
        // NotFoundException: todavía no hay código en el cuadro; seguir
        try { reader.reset(); } catch (e2) {}
      }
    }
    rafId = requestAnimationFrame(frame);
  }

  $("btnScan").onclick = async function () {
    setStatus("");
    var ok = await startCamera();
    if (!ok) return;
    if ("BarcodeDetector" in window) {
      try {
        var formats = await BarcodeDetector.getSupportedFormats();
        var use = FORMATS.filter(function (f) { return formats.indexOf(f) !== -1; });
        if (use.length) {
          detector = new BarcodeDetector({ formats: use });
          scanLoopBarcodeDetector();
          setStatus("Apunta la cámara al código y espera a que se lea.");
          return;
        }
      } catch (e) {}
    }
    scanWithZXing();
    setStatus("Apunta la cámara al código y espera a que se lea.");
  };
  $("btnStop").onclick = function () { stopCamera(); setStatus(""); };

  // ---- Guardar ----
  $("btnGuardar").onclick = function () {
    var codigo = $("codigo").value.trim();
    var cantidad = $("cantidad").value.trim();
    if (!codigo) { setStatus("Escribe o escanea un código.", "msg-err"); return; }
    if (!cantidad) { setStatus("Indica la " + (tipo === "Medidor" ? "lectura." : "cantidad."), "msg-err"); return; }

    var btn = $("btnGuardar");
    btn.disabled = true;
    setStatus("Guardando...");

    var fmt = /^\d{13}$/.test(codigo) ? "EAN-13" : "Code 128";
    var payload = {
      token: TOKEN,
      hoja: HOJA,
      tipo: tipo,
      "código": codigo,
      formato: fmt,
      cantidad: cantidad,
      usuario: $("usuario").value.trim(),
      notas: $("notas").value.trim()
    };

    // text/plain evita el preflight CORS; Apps Script lee e.postData.contents
    fetch(ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function () {
      setStatus("Enviado. Revisa la hoja para confirmar la fila.", "msg-ok");
      $("codigo").value = "";
      $("cantidad").value = "";
      $("notas").value = "";
    }).catch(function () {
      setStatus("Error de red. No se pudo enviar; inténtalo de nuevo.", "msg-err");
    }).finally(function () { btn.disabled = false; });
  };
})();
</script>
</body>
</html>
